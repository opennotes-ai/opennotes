<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vibecheck Submitter</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <details id="settings" open>
        <summary>Settings</summary>
        <div class="settings-grid">
          <label for="api-key">
            API Key
            <input id="api-key" name="api-key" type="password" autocomplete="off" placeholder="Bearer token">
          </label>
          <details id="request-key-details">
            <summary>Need an API key?</summary>
            <div class="request-key-panel">
              <label for="request-email">
                Receive one via email:
                <input id="request-email" name="request-email" type="email" placeholder="you@example.com">
              </label>
              <button id="request-key-btn" type="button">Request API Key</button>
              <small class="disclaimer">Requesting a new API key will invalidate the previous API keys sent to this email address.</small>
              <div id="request-status" role="status" aria-live="polite" hidden></div>
            </div>
          </details>
        </div>
      </details>

      <section class="panel" aria-labelledby="submit-heading">
        <h1 id="submit-heading" class="field-label">Current page</h1>
        <textarea id="current-url" readonly rows="2" aria-label="Current page URL"></textarea>
        <button id="submit-btn" type="button">Submit</button>
        <label class="expand-toggle" for="expand-all-comments">
          <input id="expand-all-comments" name="expand-all-comments" type="checkbox">
          <span>Expand all comments</span>
        </label>
        <div id="status" role="status" aria-live="polite"></div>
      </section>

      <section id="result" class="panel" aria-live="polite" hidden>
        <h2 id="result-heading">Result</h2>
        <div id="result-content"></div>
      </section>

      <div id="expand-status" class="expand-status" role="status" aria-live="polite" hidden></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
